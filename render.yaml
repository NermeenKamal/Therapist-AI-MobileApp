services:
  - type: web
    name: therapist-ai-backend
    env: php
    region: frankfurt
    plan: free
    repo: https://github.com/NermeenKamal/Therapist-AI-MobileApp
    branch: main
    rootDir: Backend
    buildCommand: "composer install"
    startCommand: "php artisan serve --host=0.0.0.0 --port=10000"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: 
      - key: APP_URL
        value: https://therapist-ai-backend.onrender.com
      - key: DB_CONNECTION
        value: sqlite


