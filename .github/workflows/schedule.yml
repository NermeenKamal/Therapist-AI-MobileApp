name: Daily Import Articles

on:
  schedule:
    - cron: '0 2 * * *' # كل يوم الساعة 2 صباحاً بتوقيت UTC
  workflow_dispatch:

jobs:
  import-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run import articles
        run: php artisan import:articles
