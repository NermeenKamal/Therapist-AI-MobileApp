[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisor/supervisord.pid

[program:laravel-server]
command=php artisan serve --host=0.0.0.0 --port=8080
directory=/var/www
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/laravel-server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/laravel-server.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
user=www-data
environment=LARAVEL_ENV="production",APP_DEBUG="false"

[program:queue-worker]
command=php artisan queue:work --timeout=120 --tries=3 --sleep=3
directory=/var/www
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/queue-worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
user=www-data
environment=LARAVEL_ENV="production",APP_DEBUG="false"

[program:scheduler]
command=php artisan schedule:work
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
user=www-data
