[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-server]
command=php artisan serve --host=0.0.0.0 --port=8080
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-server.log
stderr_logfile=/var/log/supervisor/laravel-server.err.log
user=www-data
environment=LARAVEL_ENV="production"

[program:queue-worker]
command=php artisan queue:work --timeout=120 --tries=3 --sleep=3
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker.err.log
user=www-data
environment=LARAVEL_ENV="production"
