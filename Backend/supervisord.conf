[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[program:queue-worker]
process_name=%(program_name)s
command=php artisan queue:work --tries=3 --timeout=90
directory=/var/www
autostart=true
autorestart=true
stderr_logfile=/tmp/queue-worker.err.log
stdout_logfile=/tmp/queue-worker.out.log
user=www-data
