[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:laravel-server]
command=php artisan serve --host=0.0.0.0 --port=8080
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/tmp/laravel.out.log
stderr_logfile=/tmp/laravel.err.log
user=www-data

[program:queue-worker]
command=php /var/www/artisan queue:work --timeout=120 --tries=3 --sleep=3
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/tmp/queue.out.log
stderr_logfile=/tmp/queue.err.log
user=www-data
