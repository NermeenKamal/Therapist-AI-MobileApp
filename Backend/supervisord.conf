[supervisord]
nodaemon=true

[program:web]
command=php artisan serve --host=0.0.0.0 --port=8080
directory=/var/www
autostart=true
autorestart=true
stderr_logfile=/var/www/storage/logs/web_error.log
stdout_logfile=/var/www/storage/logs/web_output.log

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www
autostart=true
autorestart=true
stderr_logfile=/var/www/storage/logs/queue_error.log
stdout_logfile=/var/www/storage/logs/queue_output.log
